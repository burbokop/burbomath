[package]
name = "burbomath_macro"
description = "Macro crate for burbokop's rust math library"
license = "MIT"
version = "0.0.2"
authors = [ "borys <burbokop@gmail.com>" ]
readme = "../README.md"
repository = "https://github.com/burbokop/burbomath"
documentation = "https://docs.rs/burbomath_macro"
keywords = [ "math", "algorithms" ]
categories = [ "algorithms" ]
edition = "2024"

[lib]
proc-macro = true

[dependencies]
syn = "2.0.117"
quote = "1.0.45"
proc-macro2 = "1.0.106"
litrs = "1.0"

[features]
default = []
